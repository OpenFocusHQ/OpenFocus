name: Build & release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Becomes the APK's versionCode and the last part of its versionName (e.g. 0.2.17).
  OPENFOCUS_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Caches Gradle and validates the wrapper JAR.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit, migration, content & screenshot tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APK (minified)
        run: ./gradlew :app:assembleRelease

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

  release:
    name: Publish GitHub release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Optional release signing. Add these repository secrets to sign with your own key
      # (see docs/RELEASING.md): OPENFOCUS_KEYSTORE_BASE64, OPENFOCUS_KEYSTORE_PASSWORD,
      # OPENFOCUS_KEY_ALIAS, OPENFOCUS_KEY_PASSWORD. Without them the APK is debug-signed.
      - name: Set up signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENFOCUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "keystore=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No release signing secrets; publishing a debug-signed testing build."
          fi

      - name: Build release APK
        env:
          OPENFOCUS_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          OPENFOCUS_KEYSTORE_PASSWORD: ${{ secrets.OPENFOCUS_KEYSTORE_PASSWORD }}
          OPENFOCUS_KEY_ALIAS: ${{ secrets.OPENFOCUS_KEY_ALIAS }}
          OPENFOCUS_KEY_PASSWORD: ${{ secrets.OPENFOCUS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Prepare release files
        id: files
        run: |
          base=$(sed -n 's/^openfocus.version=//p' gradle.properties)
          version="$base.$OPENFOCUS_BUILD_NUMBER"
          apk="OpenFocus-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          {
            echo "## Install"
            echo "Download **$apk** below and open it on your Android phone (8.0+)."
            echo "After installing, enable *OpenFocus Shield* in Settings → Accessibility."
            echo "On Android 13+, first allow *restricted settings* in the app's info page (⋮ menu)."
            echo
            if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
              echo "> **Testing build:** signed with a temporary debug key, so you may need to uninstall the previous"
              echo "> version before installing this one (your data is cleared)."
              echo
            fi
            echo "SHA-256: \`$(cut -d' ' -f1 "$apk.sha256")\`"
          } > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.files.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: OpenFocus ${{ steps.files.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ steps.files.outputs.apk }}
            ${{ steps.files.outputs.apk }}.sha256
