name: Play Store bundle

# Builds a signed Android App Bundle (.aab) for Google Play. Run it from the Actions tab, or push a
# tag like v0.3. Upload the .aab from the run's artifacts in Play Console (see docs/RELEASING.md).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Becomes the bundle's versionCode and the last part of its versionName (e.g. 0.3.12).
  OPENFOCUS_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # Play rejects debug-signed bundles, so fail early instead of building one.
      - name: Set up upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENFOCUS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the signing secrets described in docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed bundle
        env:
          OPENFOCUS_KEYSTORE: ${{ runner.temp }}/upload.jks
          OPENFOCUS_KEYSTORE_PASSWORD: ${{ secrets.OPENFOCUS_KEYSTORE_PASSWORD }}
          OPENFOCUS_KEY_ALIAS: ${{ secrets.OPENFOCUS_KEY_ALIAS }}
          OPENFOCUS_KEY_PASSWORD: ${{ secrets.OPENFOCUS_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Upload bundle and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: openfocus-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
